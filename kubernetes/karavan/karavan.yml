apiVersion: v1
kind: Namespace
metadata:
  name: karavan
  labels:
    kubernetes.io/metadata.name: karavan

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: karavan
  namespace: karavan

---
# ==========================================
# BASE DE DATOS: POSTGRESQL
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: karavan
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: karavan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: karavan
        - name: POSTGRES_USER
          value: karavan
        - name: POSTGRES_PASSWORD
          value: karavan
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgres-data
      volumes:
      - name: postgres-data
        emptyDir: {}

---
# ==========================================
# CONFIGURACIÓN Y SECRETOS LIMPIOS
# ==========================================
apiVersion: v1
kind: Secret
metadata:
  name: karavan
  namespace: karavan
stringData:
  karavan.git.repository: "https://github.com/rafabc/karavan-repository"
  karavan.git.username: "rafabc"
  karavan.git.password: "123123"
  karavan.git.branch: "main"
  karavan.container-image.registry: "registry:5000"
  karavan.container-image.group: "karavan"
  quarkus.datasource.username: "karavan"
  quarkus.datasource.password: "karavan"
  quarkus.datasource.jdbc.url: "jdbc:postgresql://postgres:5432/karavan"

---
# ==========================================
# PERMISOS RBAC
# ==========================================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: karavan
  namespace: karavan
rules:
- apiGroups: [""]
  resources: ["secrets", "configmaps", "serviceaccounts", "namespaces"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["persistentvolumes", "persistentvolumeclaims"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["pods", "services", "replicationcontrollers"]
  verbs: ["*"]
- apiGroups: ["route.openshift.io"]
  resources: ["routes"]
  verbs:  ["*"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["*"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["*"]
- apiGroups: ["image.openshift.io"]
  resources: ["imagestreams/layers"]
  verbs: ["update", "get"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create", "get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: karavan-role-binding
  namespace: karavan
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: karavan
subjects:
- kind: ServiceAccount
  name: karavan
  namespace: karavan

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: karavan-cluster-role-binding-view
roleRef:
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
  name: view
subjects:
- kind: ServiceAccount
  name: karavan
  namespace: karavan

---
# ==========================================
# DESPLIEGUE PRINCIPAL (Corregido Enrutamiento Web)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karavan
  namespace: karavan
  labels:
    app: karavan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karavan
  template:
    metadata:
      labels:
        app: karavan
    spec:
      serviceAccountName: karavan
      containers:
        - name: karavan
          image: ghcr.io/apache/camel-karavan:4.18.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: karavan
          resources:
            requests:
              memory: "1024Mi"
          env:
            - name: PLATFORM_USER
              value: "admin"
            - name: PLATFORM_PASSWORD  
              value: "admin"
            - name: KARAVAN_ENVIRONMENT
              value: "dev"
            - name: KARAVAN_AUTH
              value: "public"
            # FORZAR A QUARKUS A ESCUCHAR EN TODAS LAS INTERFACES DE RED
            - name: QUARKUS_HTTP_HOST
              value: "0.0.0.0"
            - name: KARAVAN_CONTAINER_STATUS_INTERVAL
              value: "disabled"
            - name: KARAVAN_CONTAINER_STATISTICS_INTERVAL
              value: "disabled"
            - name: KARAVAN_CAMEL_STATUS_INTERVAL
              value: "3s"
            - name: KARAVAN_DEVMODE_IMAGE
              value: "ghcr.io/apache/camel-karavan-devmode:4.18.1"
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  key: "quarkus.datasource.username"
                  name: "karavan"
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: "quarkus.datasource.password"
                  name: "karavan"
            - name: QUARKUS_DATASOURCE_JDBC_URL
              valueFrom:
                secretKeyRef:
                  key: "quarkus.datasource.jdbc.url"
                  name: "karavan"
            - name: karavan.git.repository
              valueFrom:
                secretKeyRef:
                  key: karavan.git.repository
                  name: karavan
            - name: karavan.git.username
              valueFrom:
                secretKeyRef:
                  key: karavan.git.username
                  name: karavan
            - name: karavan.git.password
              valueFrom:
                secretKeyRef:
                  key: karavan.git.password
                  name: karavan
            - name: karavan.git.branch
              valueFrom:
                secretKeyRef:
                  key: karavan.git.branch
                  name: karavan
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace

---
# ==========================================
# SERVICIO EXTERNO (NodePort)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: karavan
  namespace: karavan
spec:
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: 8080
    nodePort: 30777
    protocol: TCP
  selector:
    app: karavan